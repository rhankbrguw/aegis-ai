services:
  redis:
    image: redis:7-alpine
    container_name: aegis_redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  gateway:
    build:
      context: ../services/gateway
      dockerfile: Dockerfile
    container_name: aegis_gateway
    ports:
      - "${HOST_PORT:-8085}:8080"
    environment:
      - PORT=8080
      - REDIS_ADDR=redis:6379
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: always

volumes:
  redis_data:
