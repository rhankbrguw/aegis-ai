name: AegisAI CI/CD Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gateway-ci:
    name: Go Gateway Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/gateway/go.sum

      - name: Install Dependencies
        run: go mod download

      - name: Static Analysis (Go Vet)
        run: go vet ./...

      - name: Run Unit & Race Tests
        run: go test -v -race -cover ./...

      - name: Verify Docker Build
        run: docker build -t aegis-gateway:latest .

  mobile-ci:
    name: Flutter Mobile Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Analyze Flutter Code
        run: flutter analyze

      - name: Run Widget & Unit Tests
        run: flutter test
